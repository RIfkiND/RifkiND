<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Let's build reliable systems together">
<style>
.hand{font-family:"Excalifont","Virgil","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.float{animation:float 3.5s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
</filter>
<clipPath id="card"><rect width="900" height="200" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="900" height="200" fill="#ffffff"/>

<g class="hand">
  <g class="rise" style="animation-delay:0ms">
    <text x="44" y="48" font-size="12" letter-spacing="2" font-weight="700" fill="#6b7280">LET'S CONNECT · OPEN FOR OPPORTUNITIES</text>
  </g>
  <g class="rise" style="animation-delay:70ms">
    <text x="42" y="86" font-size="30" font-weight="700" fill="#111827">Let's build reliable systems together.</text>
  </g>
  <g filter="url(#rough)" class="fade" style="animation-delay:200ms">
    <path d="M44 97 C180 92 360 102 520 95 S 620 98 640 96" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g class="rise" style="animation-delay:140ms">
    <text x="44" y="125" font-size="14.5" fill="#4b5563">Backend architecture, distributed services &amp; automated cloud infrastructure.</text>
  </g>

  <!-- Email CTA Pill -->
  <g class="rise" style="animation-delay:200ms">
    <rect filter="url(#rough)" x="44" y="142" width="310" height="38" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
    <g transform="translate(56 151) scale(0.85)">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" fill="#EA4335"/>
    </g>
    <text class="hand" x="84" y="166" font-size="14.5" font-weight="600" fill="#111827">rifkinauvaldzaki08@gmail.com</text>
  </g>
</g>

<!-- Isometric Doodle Server Beacon on Right Side -->
<g class="float" transform="translate(760 100)">
  <g filter="url(#rough)" fill="none" stroke="#1f2937" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="50,28 0,56 0,50 50,22" fill="#e5e7eb"/>
    <polygon points="-50,28 0,56 0,50 -50,22" fill="#d1d5db"/>
    <polygon points="0,-6 50,22 0,50 -50,22" fill="#f3f4f6"/>
    
    <polygon points="50,-10 0,18 0,12 50,-16" fill="#e5e7eb"/>
    <polygon points="-50,-10 0,18 0,12 -50,-16" fill="#d1d5db"/>
    <polygon points="0,-44 50,-16 0,12 -50,-16" fill="#f3f4f6"/>
    
    <line x1="0" y1="-44" x2="0" y2="-62" stroke-dasharray="2 3"/>
    <circle cx="0" cy="-66" r="5" fill="#3fb950" stroke="none"/>
  </g>
</g>
</g>
<rect x=".5" y=".5" width="899" height="199" rx="13.5" fill="none" stroke="#e5e5e5"/>
</svg>