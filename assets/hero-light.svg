<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Rifki Nauva Dzaki. Backend and software engineer building reliable APIs, services and AI-powered systems."><title>Rifki Nauva Dzaki. Backend and software engineer building reliable APIs, services and AI-powered systems.</title>
<style>
.hand{font-family:"Excalifont","Virgil","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.flow{stroke-dasharray:4 4;animation:flow 1.4s linear infinite}
.float{animation:float 4s ease-in-out infinite alternate}
/* assemble loop: 5s cycle */
.aB{animation:aB 5s infinite both}
.aM{animation:aM 5s infinite both}
.aT{animation:aT 5s infinite both}
.pop{animation:pop 5s infinite both}
.conn{animation:conn 5s infinite both}
.req,.res{opacity:0;animation:req 5s infinite both}
.res{animation-name:res}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes aB{0%{opacity:0;transform:translateY(30px);animation-timing-function:cubic-bezier(.2,.9,.25,1)}10%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(30px)}}
@keyframes aM{0%,6%{opacity:0;transform:translateY(-44px)}14%{opacity:1;transform:translateY(-44px);animation-timing-function:cubic-bezier(.2,.9,.25,1.15)}30%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-44px)}}
@keyframes aT{0%,10%{opacity:0;transform:translateY(-88px)}18%{opacity:1;transform:translateY(-88px);animation-timing-function:cubic-bezier(.2,.9,.25,1.15)}36%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(-88px)}}
@keyframes pop{0%,36%{opacity:0;transform:translateY(-10px);animation-timing-function:cubic-bezier(.2,.9,.25,1.2)}46%{opacity:1;transform:translateY(0)}86%{opacity:1;transform:translateY(0)}94%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes conn{0%,34%{opacity:0}42%{opacity:1}86%{opacity:1}94%,100%{opacity:0}}
@keyframes req{0%,44%{opacity:0;transform:translateY(0)}48%{opacity:1}64%{opacity:1;transform:translateY(118px)}68%,100%{opacity:0;transform:translateY(118px)}}
@keyframes res{0%,66%{opacity:0;transform:translateY(0)}70%{opacity:1}84%{opacity:1;transform:translateY(-118px)}88%,100%{opacity:0;transform:translateY(-118px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>
<clipPath id="card"><rect width="900" height="280" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="900" height="280" fill="#ffffff"/>

