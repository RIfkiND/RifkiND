<g class="rise" style="animation-delay:0ms"><text x="44" y="92" font-size="13" letter-spacing="2" font-weight="700" fill="#6b7280">BACKEND &amp; DEVOPS</text></g>
<g class="rise" style="animation-delay:70ms"><text x="42" y="142" font-size="42" font-weight="700" fill="#111827">Rifki Nauva Dzaki</text></g>
<g filter="url(#rough)" class="fade" style="animation-delay:200ms"><path d="M44 155 C130 149 230 160 330 152 S 400 155 418 153" fill="none" stroke="#111827" stroke-width="2.6" stroke-linecap="round"/></g>
<g class="rise" style="animation-delay:140ms"><text x="44" y="186" font-size="19" font-weight="600" fill="#1f2937">Software Engineer</text></g>
<g class="rise" style="animation-delay:200ms"><text x="44" y="212" font-size="14" fill="#4b5563">Building reliable APIs, services and AI-powered systems.</text></g>
</g>
    
